name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versions pinned to Fabric Runtime 2.0 (GA): Java 21, Python 3.13, Spark 4.1, Delta 4.2.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python tools/check_hygiene.py
        env:
          HYGIENE_FORBIDDEN: ${{ secrets.HYGIENE_FORBIDDEN }}
