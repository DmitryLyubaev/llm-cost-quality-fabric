[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse"
version = "0.1.0"
description = "Offline-testable lakehouse package, later deployed to Microsoft Fabric"
readme = "README.md"
# Pinned to the current Fabric GA runtime, Runtime 2.0, per Microsoft Learn
# "Apache Spark runtime in Fabric" (learn.microsoft.com/fabric/data-engineering/runtime)
# and "Runtime 2.0 in Fabric" (.../runtime-2-0), read 2026-10-21:
#   Spark 4.1 (4.1.1), Delta Lake 4.2, Python 3.13, Java 21, Scala 2.13.
# Runtime 1.3 (Spark 3.5, Delta 3.2, Python 3.11, Java 11) is now EOSA, not GA.
# delta-spark 4.2.0 requires pyspark>=4.0.1,<=4.1.1, so pyspark is pinned to 4.1.1.
requires-python = ">=3.13,<3.14"
# Fabric provides Spark and Delta, so the wheel needs only `requests` at runtime. Local tests and
# CI install the `spark` extra (`pip install -e ".[dev,spark]"`).
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
spark = [
    "pyspark==4.1.1",
    "delta-spark==4.2.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "build>=1.2",
    "pyyaml>=6.0.3",
    # fabric-cicd 1.4.0's own pin: the tests evaluate parameter.yml's key_value_replace paths with it.
    "jsonpath-ng>=1.7.0,<1.8.0",
]
deploy = [
    "fabric-cicd==1.4.0",
    "azure-identity",
    "azure-storage-file-datalake",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lakehouse = ["seeds/*.csv", "seeds/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q"
